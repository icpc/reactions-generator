[tool.poetry]
name = "reactions-generator"
version = "0.1.0"
description = "A library to generate reactions for icpc contests"
authors = ["Azat Ismagilov <azatismagilov00@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"
pillow = "^12.0.0"
tqdm = "^4.67.1"
typer = "^0.20.0"
numpy = "^2.3.5"
typed-ffmpeg = "^3.8.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
ruff = "^0.14.8"
pyright = "^1.1.407"

[tool.poetry.scripts]
main = "reactions_generator.cli:main"

[tool.pyright]
typeCheckingMode = "strict"
reportMissingImports = false
reportUnknownMemberType = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
