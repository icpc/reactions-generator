[tool.poetry]
name = "reactions-generator"
version = "0.1.0"
description = "A library to generate reactions for icpc contests"
authors = ["Azat Ismagilov <azatismagilov00@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34.2"
pillow = "^13.0.0"
tqdm = "^4.70.1"
typer = "^0.28.0"
numpy = "^2.5.4"
typed-ffmpeg = "^4.6.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.4"
pyright = "^1.1.414"

[tool.poetry.scripts]
main = "reactions_generator.cli:main"

[tool.pyright]
typeCheckingMode = "strict"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
